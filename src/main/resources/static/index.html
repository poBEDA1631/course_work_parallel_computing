<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parallel Search</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Parallel Search</h1>
    <span id="ollama" class="badge status unknown">Ollama: unknown</span>
  </header>

  <main>
    <div id="banner" class="banner" role="alert" hidden></div>

    <section class="card" aria-labelledby="index-title">
      <h2 id="index-title">Index</h2>
      <p id="index-status" class="muted">Checking index...</p>
      <div class="row">
        <label for="threads" class="muted">Threads</label>
        <input id="threads" type="number" min="1" max="256" value="8">
        <button id="build" type="button">Build index</button>
      </div>
    </section>

    <section class="card" aria-labelledby="search-title">
      <h2 id="search-title">Search</h2>
      <form id="search-form" class="row" autocomplete="off">
        <input id="query" type="search" placeholder="good movies about space" aria-label="Query">
        <button type="submit">Search</button>
      </form>
      <div id="expansion" class="expansion"></div>
      <div id="results"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
