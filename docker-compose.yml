services:
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      # Never unload the model: a cold load takes longer than the 5 s expansion timeout, and
      # Ollama aborts a load whose client has disconnected.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - search-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      WARMUP_PROMPT: |-
        You expand short search queries into related keywords for a movie and music review search engine. Respond with ONLY a comma-separated list of 3 to 8 related keywords, no explanation.

        Query: "scary movies"
        Keywords: horror, thriller, suspense, halloween, frightening, slasher

        Query: "guitar music"
        Keywords: rock, acoustic, strings, instrumental, band, blues

        Query: "warm up"
        Keywords:
    # Pull, then run the expansion prompt once (same text as QueryExpansionService) so the model
    # is loaded and the shared prompt prefix is already evaluated before the first real query.
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$$OLLAMA_MODEL"
        ollama run "$$OLLAMA_MODEL" "$$WARMUP_PROMPT" > /dev/null
        echo "model $$OLLAMA_MODEL pulled and loaded"
    restart: "no"
    networks:
      - search-net
    depends_on:
      ollama:
        condition: service_healthy

  dataset-init:
    build:
      context: .
      dockerfile: dataset-init/Dockerfile
    environment:
      DATASET_DIR: /data
      DATASET_MAX_BYTES: ${DATASET_MAX_BYTES:-1500000000}
    restart: "no"
    volumes:
      - dataset:/data
    networks:
      - search-net

  search:
    build: .
    # The index lives only in memory: after a crash the API comes back without one, and
    # /api/health and the UI work again until it is rebuilt.
    restart: unless-stopped
    # Leaves room for the loaded Ollama model (about 3 GB) on an 8 GB Docker VM. The JVM sizes its
    # heap from this limit (MaxRAMPercentage=75 in the Dockerfile, about 3.4 GB), which holds one
    # index of the full corpus (about 1.9 GB) plus the garbage of a build.
    mem_limit: 4.5g
    environment:
      PORT: ${PORT:-8080}
      DATASET_DIR: /data
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - dataset:/data:ro
    networks:
      - search-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dataset-init:
        condition: service_completed_successfully

volumes:
  ollama-models:
  dataset:

networks:
  search-net:
